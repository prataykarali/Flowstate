<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>PrismLab P7 — Six-Model Atlas</title><style>
:root {color-scheme:dark; --mint:#52efd0; --blue:#67baff; --pink:#d6a0ff; --background:#070d19}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050913}
body{display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
.arch{width:min(100vw,1590px);max-height:100vh;height:auto;display:block;aspect-ratio:1380/1030}
.header{font-family:inherit;font-size:38px;font-weight:760;letter-spacing:-.8px;fill:#eff7ff}
.section-label{font-size:15px;fill:#9bb3db;font-weight:720;letter-spacing:1.8px}
.top-label{font-size:22px;fill:#f4f8ff;font-weight:710}
.top-sub{font-size:14px;fill:#acc6e8}
.model-label{font-size:20px;font-weight:730;fill:#f1f6ff;letter-spacing:-.5px}
.model-role{font-size:12px;fill:#9db5df;font-weight:640;letter-spacing:1.5px}
.pipeline-title{font-size:20.5px;font-weight:760;fill:#f3f7ff;letter-spacing:-.3px}
.pipeline-sub{font-size:16px;fill:#aebfe3;font-weight:540}
.final-label{font-size:23px;font-weight:760;fill:#f3f7ff}
.final-sub{font-size:14px;fill:#b2c5e6;letter-spacing:.2px}
.core rect.node-base{fill:#101f3b;stroke:#426b9c;stroke-width:1.6}
.core.route rect.node-base{fill:#13264b;stroke:#55a9f5;stroke-width:2}
.node-base{fill:#121d34;stroke:#476a95;stroke-width:1.6;filter:url(#softShadow)}
.model .node-base{transition:stroke .35s, filter .35s, fill .35s}
.model.on .node-base{stroke:#52efd0;fill:#122b39;filter:url(#mintGlow)}
.model[data-model="d1"].on .node-base,.model[data-model="d1omni"].on .node-base{stroke:#d6a0ff;fill:#29213d;filter:url(#pinkGlow)}
.model.on .icon-bubble circle{stroke:#51eec9;fill:#113c40}
.model[data-model="d1"].on .icon-bubble circle,.model[data-model="d1omni"].on .icon-bubble circle{stroke:#d6a0ff;fill:#342447}
.icon-bubble circle{fill:#20324e;stroke:#456e9f;stroke-width:1.2}
.icon-bubble use{stroke:#d6e7ff;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none}
.core .icon-bubble circle{fill:#16446a;stroke:#69b7ef}
.pool-boundary{fill:url(#poolBG);stroke:#375c89;stroke-opacity:.75;stroke-width:1.4;stroke-dasharray:8 9}
.mini-star{fill:#6ca9f4;opacity:.4}
.pipe .node-base{fill:#12203a;stroke:#5075a6;stroke-width:1.8;transition:stroke .35s,fill .35s,filter .35s}
.pipe.on .node-base{stroke:var(--accent);fill:var(--fill);filter:url(#focusGlow)}
.pipe .pipe-icon-bg{fill:#213653;stroke:#567ab0;stroke-width:1.5}
.pipe.on .pipe-icon-bg{fill:#19394b;stroke:var(--accent)}
.pipe .pipe-icon{stroke:#d6e5ff;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pipe.on .pipe-icon{stroke:var(--accent)}
.pipe{cursor:pointer;outline:none}
.pipe:focus-visible .node-base{stroke:#f6f7ff;stroke-width:3}
.pipe[data-flow="doc"]{--accent:#52efd0;--fill:#102d35}
.pipe[data-flow="voice"]{--accent:#67baff;--fill:#112740}
.pipe[data-flow="decision"]{--accent:#d6a0ff;--fill:#261d40}
.link{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.16;transition:opacity .4s,filter .4s,stroke-width .4s;pointer-events:none}
.link.source{stroke:#80b8f6;stroke-dasharray:5 9;animation:dash 1.4s linear infinite}
.link.converge{stroke:#80b8f6;stroke-width:2.5;stroke-dasharray:7 10;animation:dash 1.4s linear infinite}
.link.on{stroke:var(--accent);stroke-width:3.2;opacity:.88;filter:drop-shadow(0 0 6px var(--accent))}
.link.mint{--accent:#52efd0}.link.blue{--accent:#67baff}.link.pink{--accent:#d6a0ff}
.link.trunk{stroke:#67baff;opacity:.8;filter:drop-shadow(0 0 5px #67baff);stroke-dasharray:5 11;animation:dash 1.6s linear infinite}
.signal{fill:var(--accent);opacity:.08;transition:opacity .35s;filter:drop-shadow(0 0 5px var(--accent))}
.signal.on{opacity:1}
.signal.mint{--accent:#52efd0}.signal.blue{--accent:#67baff}.signal.pink{--accent:#d6a0ff}
.pipeline-group{filter:drop-shadow(0 5px 17px rgba(0,0,0,.12))}
.final rect.node-base{fill:#122a45;stroke:#60aefa;stroke-width:1.8;filter:url(#blueGlow)}
@keyframes dash{to{stroke-dashoffset:-28}}
@media(prefers-reduced-motion:reduce){.link{animation:none}.signal{display:none}}

/* Additional processing stage and three downstream destinations */
.stage .node-base{fill:#101e37;stroke:#4a719d;stroke-width:1.7;transition:stroke .3s,fill .3s,filter .3s}
.stage.on .node-base{stroke:var(--accent);filter:url(#focusGlow)}
.stage .pipe-icon-bg{fill:#203450;stroke:#4c759e;stroke-width:1.4}
.stage .pipe-icon{fill:none;stroke:#b8d1f4;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage.on .pipe-icon{stroke:var(--accent)}
.stage[data-flow="doc"]{--accent:#52efd0}
.stage[data-flow="voice"]{--accent:#67baff}
.stage[data-flow="decision"]{--accent:#d6a0ff}
.stage-label{font-size:21px;font-weight:750;fill:#eaf5ff}
.stage-hint{font-size:13px;fill:#9cb9de;letter-spacing:.3px}
.output .node-base{fill:#13213c;stroke:#5584b5;stroke-width:1.8;filter:url(#softShadow);transition:stroke .3s,filter .3s}
.output:hover .node-base{stroke:#82c9ff;filter:url(#blueGlow)}
.output-icon{fill:#203451;stroke:#6a9fd2;stroke-width:1.4}
.output use{fill:none;stroke:#d6e7ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.output-title{font-size:21px;font-weight:750;fill:#f0f7ff}
.output-sub{font-size:13px;fill:#a9c6ec}
.link.deliver{stroke:#69c6fa;opacity:.75;stroke-width:2.6;filter:drop-shadow(0 0 4px #67baff);stroke-dasharray:5 10;animation:dash 1.3s linear infinite}
.link.stage-path{stroke-width:2.6}
.stage-title{font-size:15px;letter-spacing:1.8px;font-weight:700;fill:#86a5cc}


/* P7-only additions: exact P6 color variables, node geometry and symbols are reused above. */
html,body{height:auto;min-height:100%;overflow:auto}
body{display:block;background:#050913}
.atlas-layout{width:100%;max-width:1600px;margin:auto;padding:8px 10px 18px}
.arch{margin:auto;display:block;width:100%;height:auto;max-height:none;aspect-ratio:1380/1030}
.navnode{cursor:pointer;outline:none}
.navnode.active .node-base{stroke:#52efd0;fill:#122b39;filter:url(#mintGlow)}
.navnode:hover .node-base,.navnode:focus-visible .node-base{stroke:#e9fbff;stroke-width:2.6}
.navnode:not(.active) .model-role{fill:#90a7ca}
.layer-link{fill:none;stroke:#67baff;stroke-width:2.3;opacity:.48;stroke-linecap:round;stroke-dasharray:4 7;animation:dash 1.4s linear infinite}
.step-node{cursor:pointer;outline:none}
.step-node .node-base{fill:#121d34;stroke:var(--accent);stroke-width:1.3;transition:fill .22s,stroke-width .22s,filter .22s}
.step-node.active .node-base{fill:var(--node-fill);stroke-width:3;filter:drop-shadow(0 0 7px var(--accent))}
.step-node:focus-visible .node-base,.step-node:hover .node-base{stroke:#fff;stroke-width:2.6}
.layer-no{font-size:18px;font-weight:800;fill:#f4f8ff;letter-spacing:.5px}
.layer-label{font-size:10px;font-weight:750;fill:var(--accent);letter-spacing:.6px}
.layer-desc{font-size:10px;font-weight:500;fill:#a8c2df}
.controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:0 auto 14px;padding:3px 10px 8px;color:#acc6e8;font-family:inherit}
.controls button,.controls a{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:37px;padding:8px 14px;border:1px solid #476a95;background:#13264b;color:#f4f8ff;border-radius:13px;font:600 13px inherit;text-decoration:none;cursor:pointer}
.controls button:hover,.controls a:hover,.controls button:focus-visible,.controls a:focus-visible{border-color:#52efd0;color:#e5fff9}
.controls button:focus-visible,.controls a:focus-visible{outline:2px solid #52efd0;outline-offset:3px}
#atlas-live-status{min-width:210px;text-align:center;font-size:13px}
@media(prefers-reduced-motion:reduce){.layer-link{animation:none}}
@media(max-width:700px){.atlas-layout{padding:4px}.controls{gap:7px}.controls button,.controls a{font-size:12px;padding:6px 9px;min-height:34px}}

</div></main><script>
(()=>{
  'use strict';
  const models={text:'LFM3-1.7B',vision:'LFM3-VL-2B',audio:'LFM3-Audio-2B',omni:'LFM3-Omni-2B',d1:'d1-2B',d1omni:'d1-Omni-2B'};
  const schedule=Array.from({length:24},(_,i)=>i%4===2?'full_attention':(i%4===0&&i>0?'sliding_attention':'conv'));
  const labels={conv:'Gated short convolution',sliding_attention:'Sliding-window attention',full_attention:'Global attention'};
  const detail={conv:'Kernel size 7 · bounded recurrent state',sliding_attention:'Window size 256 tokens · full RoPE',full_attention:'Global context · head-wise gate · partial RoPE'};
  const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let step=0, selected='text', play=!reducedMotion, timer=null;
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  function refresh(){
    $$('.navnode').forEach(n=>n.classList.toggle('active',n.dataset.model===selected));
    $('#text-view').style.display=selected==='text'?'':'none';
    $('#pending-view').style.display=selected==='text'?'none':'';
    if(selected!=='text'){$('#pending-name').textContent=models[selected]+' · Architecture pending'}
    $$('.step-node').forEach(n=>n.classList.toggle('active',selected==='text'&&Number(n.dataset.step)===step));
    $('#selected-title').textContent=`Layer ${String(step+1).padStart(2,'0')} · ${labels[schedule[step]]}`;
    $('#selected-detail').textContent=detail[schedule[step]];
    $('#atlas-live-status').textContent=selected==='text'?`LFM3-1.7B · Layer ${String(step+1).padStart(2,'0')}/24`:`${models[selected]} · audit pending`;
    $('#atlas-play').textContent=play?'Pause animation':'Play animation';
    // Page URL is an accessible anchor directly to each of the six model pages.
  }
  function stop(){if(timer!==null){window.clearInterval(timer);timer=null}}
  function start(){stop();if(play&&selected==='text'&&!reducedMotion){timer=window.setInterval(()=>{step=(step+1)%24;refresh()},1100)}}
  function pickModel(id,updateHash=true){if(!(id in models))return;selected=id;step=0;refresh();start();if(updateHash)window.location.hash=id}
  function pickLayer(n){step=n;refresh()}
  function bindAccessible(nodes,fn){nodes.forEach(n=>{
    n.addEventListener('click',()=>fn(n));
    n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(n)}});
  })}
  bindAccessible($$('.navnode'),n=>pickModel(n.dataset.model));
  bindAccessible($$('.step-node'),n=>pickLayer(Number(n.dataset.step)));
  $('#atlas-play').addEventListener('click',()=>{play=!play;refresh();start()});
  $('#atlas-step').addEventListener('click',()=>{play=false;step=(step+1)%24;refresh();start()});
  $('#atlas-reset').addEventListener('click',()=>{selected='text';step=0;play=!reducedMotion;refresh();start();window.location.hash='text'});
  window.addEventListener('hashchange',()=>pickModel(window.location.hash.slice(1),false));
  pickModel(models[window.location.hash.slice(1)]?window.location.hash.slice(1):'text',false);
})();
</script></body></html>
